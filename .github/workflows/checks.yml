# Updated GitHub Actions workflow: split UI test into its own job

name: Regression checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # increased to give room for all non‑UI steps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Lint
        run: ruff check hatua tests scripts
      - name: Tests (coverage is information only, no threshold)
        run: python -m pytest -q --cov=hatua --cov-report=term
      - name: Evaluations (rules planner and scripted stand-ins, no Ollama)
        run: python scripts/run_evals.py
      - name: Build the synthetic teacher demo
        run: python scripts/package_teacher_demo.py
      - name: Upload built UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: dist

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download UI bundle from build job
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: dist
      - name: Install node dependencies (no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run UI integration tests
        run: npm run test:ui
